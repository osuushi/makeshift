name: Load macOS CI runtime
description: Install dependencies and unpack this run's native runtime with permissions and symlinks intact.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: macos-runtime
        path: .cache/ci
    - name: Unpack runtime
      shell: bash
      run: tar -xzf .cache/ci/macos-runtime.tar.gz
    - name: Verify native executable permissions and solver/kernel library loading
      shell: bash
      run: |
        for executable in .build/{host-native,solver,kernel,mesh}/bin/makeshift-*; do
          test -x "$executable"
        done
        for calculator in .build/{solver,kernel}/bin/makeshift-*; do
          "$calculator" </dev/null
        done
