name: Release all
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-all
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = refs/heads/main || { echo 'Run Release all from main'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Require successful Check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/required-check.mjs
  macos:
    needs: preflight
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
  web:
    needs: preflight
    uses: ./.github/workflows/release-web.yml
    secrets: inherit
    permissions:
      contents: write
