name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run check
      # Launcher-selection checks import compiled host modules, but need no native build.
      - run: npx tsc -p tsconfig.host.json
      - run: npm run test:setup
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/ci-native
        id: native
        with:
          sdk-prefix: occt-linux-x64
      - name: Build solver
        run: npm run setup:native
      - name: Build OCCT SDK and kernel
        run: npm run setup:kernel
      - uses: ./.github/actions/ci-save-sdk
        if: always() && !cancelled() && steps.native.outcome == 'success' && steps.native.outputs.sdk-cache-hit != 'true'
        with:
          sdk-prefix: occt-linux-x64
          sdk-key: ${{ steps.native.outputs.sdk-key }}
      - name: Build mesh calculator
        run: npm run setup:mesh
      - name: Build desktop renderer and host
        run: npm run build
      - name: Archive runtime (preserve native permissions and library symlinks)
        run: |
          mkdir -p .cache/ci
          tar -czf .cache/ci/linux-runtime.tar.gz \
            .build/host .build/renderer .build/host-native/bin \
            .build/solver/bin .build/kernel/bin .build/mesh/bin .cache/kernel/sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-runtime
          path: .cache/ci/linux-runtime.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  model:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-linux-runtime
      - name: Compile tests
        run: |
          node scripts/clean-tests.mjs
          npx tsc -p tsconfig.test.json
      - name: Serial geometry tests, shard ${{ matrix.shard }}/4
        run: node scripts/ci-model-tests.mjs linux ${{ matrix.shard }}/4
  controls:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, electron]
        shard: [1, 2, 3]
    env:
      MAKESHIFT_TEST_FRAME_MODE: on-demand
      MAKESHIFT_TEST_BROWSER: ${{ matrix.browser }}
      DEBUG: ${{ matrix.browser == 'electron' && 'pw:browser' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-linux-runtime
      - name: Browser and display dependencies
        run: npx playwright install --with-deps ${{ matrix.browser == 'electron' && 'chromium' || matrix.browser }}
      - name: Ordinary controls and runtime cleanup
        run: |
          xvfb-run -a npm run test:current-tools -- --shard=${{ matrix.shard }}/3
          xvfb-run -a node tests/ui-runtime-cleanup.mjs
      - name: Decorator removal and command readiness
        if: matrix.shard == 1
        run: |
          xvfb-run -a node tests/decorator-removal-ui.mjs
          xvfb-run -a node tests/selection-redo-ui.mjs
          xvfb-run -a node tests/command-readiness-ui.mjs
          xvfb-run -a node tests/face-offset-readiness-ui.mjs
      - name: Browser preview readiness
        if: matrix.shard == 1 && matrix.browser == 'chromium'
        run: |
          xvfb-run -a node tests/preview-action-readiness-ui.mjs
          xvfb-run -a node tests/preview-seed-readiness-ui.mjs
      - name: Thread settings correction
        if: matrix.shard == 2
        run: |
          xvfb-run -a node tests/thread-application-ui.mjs
          xvfb-run -a node tests/thread-correction-ui.mjs
      - name: Boolean operand collection and preferences
        if: matrix.shard == 2
        run: xvfb-run -a node tests/boolean-collection-ui.mjs
      - name: Modal Undo boundaries
        if: matrix.shard == 3
        run: xvfb-run -a node tests/modal-undo-boundary-ui.mjs
      - name: Demand rendering and fresh frame capture
        if: matrix.shard == 1
        run: xvfb-run -a node tests/ui-demand-frames.mjs
  electron-host:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    env:
      MAKESHIFT_TEST_BROWSER: electron
      MAKESHIFT_TEST_FRAME_MODE: on-demand
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-linux-runtime
      - name: Display dependencies
        run: npx playwright install-deps chromium
      - name: Hidden Electron host routes
        run: xvfb-run -a npm run test:electron -- --shard=${{ matrix.shard }}/7 --without-navigation
  macos-smoke:
    needs: static
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      MAKESHIFT_TEST_BROWSER: electron
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/ci-native
        id: native
        with:
          sdk-prefix: occt-macos-arm64
      - name: Build solver
        run: npm run setup:native
      - name: Build OCCT SDK and kernel
        run: npm run setup:kernel
      - uses: ./.github/actions/ci-save-sdk
        if: always() && !cancelled() && steps.native.outcome == 'success' && steps.native.outputs.sdk-cache-hit != 'true'
        with:
          sdk-prefix: occt-macos-arm64
          sdk-key: ${{ steps.native.outputs.sdk-key }}
      - name: Build mesh calculator
        run: npm run setup:mesh
      - name: Build desktop renderer and host
        run: npm run build
      - name: Native host and macOS setup tests
        run: |
          npx tsc -p tsconfig.test.json
          node --test --test-concurrency=1 \
            .cache/sketch-tests/tests/agent-shell-path.test.js \
            .cache/sketch-tests/tests/agent-process-scope.test.js \
            .cache/sketch-tests/tests/native-calculator.test.js \
            .cache/sketch-tests/tests/native-mesh-protocol.test.js
          npm run test:setup
      - name: Required platform-sensitive geometry cases
        run: node scripts/ci-model-tests.mjs mac
      - name: WebKit controls and runtime cleanup
        env:
          MAKESHIFT_TEST_BROWSER: webkit
        run: |
          npx playwright install webkit
          node tests/decorator-removal-ui.mjs
          node tests/selection-redo-ui.mjs
          node tests/command-readiness-ui.mjs
          node tests/face-offset-readiness-ui.mjs
          node tests/preview-action-readiness-ui.mjs
          node tests/preview-seed-readiness-ui.mjs
          npm run test:current-tools
          node tests/ui-runtime-cleanup.mjs
      - name: Thread settings correction
        env:
          MAKESHIFT_TEST_BROWSER: webkit
        run: |
          node tests/thread-application-ui.mjs
          node tests/thread-correction-ui.mjs
      - name: Modal Undo boundaries
        env:
          MAKESHIFT_TEST_BROWSER: webkit
        run: node tests/modal-undo-boundary-ui.mjs
      - name: Boolean operand collection and preferences
        env:
          MAKESHIFT_TEST_BROWSER: webkit
        run: node tests/boolean-collection-ui.mjs
      - name: Built Electron host smoke and Finder launch
        run: |
          node tests/electron-smoke.mjs
          node tests/ui-runtime-cleanup.mjs
          node tests/agent-finder-launch.mjs
      - name: Orientation cube click and touch acceptance
        run: |
          MAKESHIFT_TEST_BROWSER=webkit node tests/orientation-cube-ui.mjs
          MAKESHIFT_TEST_BROWSER=electron node tests/orientation-cube-ui.mjs
      - name: Native Electron navigation gestures
        run: npm run test:electron -- --navigation-only
  # Preserve the existing required check name; failed or skipped lanes cannot pass.
  check:
    if: always()
    needs: [static, linux-build, model, controls, electron-host, macos-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
