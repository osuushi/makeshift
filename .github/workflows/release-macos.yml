name: Release macOS arm64
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-macos-arm64
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/release-macos-build.yml
    secrets: inherit
  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    environment: macos-release
    env:
      MAKESHIFT_SIGN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/macos-release-stage
        with:
          artifact: macos-unsigned
      - name: Sign the accepted app without rebuilding
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/release/sign-macos.sh app
      - name: Preserve package for the next stage
        run: node scripts/release/package-checkpoint.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-signed
          path: .build/macos-package.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
  notarize-app:
    needs: sign
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/macos-release-stage
        with:
          artifact: macos-signed
      - name: Submit signed app and require notarization acceptance
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release/notarize.mjs app
  package-dmg:
    needs: notarize-app
    runs-on: macos-15
    timeout-minutes: 15
    environment: macos-release
    env:
      MAKESHIFT_SIGN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/macos-release-stage
        with:
          artifact: macos-signed
          ticket-network: 'true'
          dmg-tools: 'true'
      - name: Staple and validate accepted app
        run: node scripts/release/staple.mjs app
      - name: Make and sign DMG from the stapled app
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/release/sign-macos.sh dmg
      - name: Preserve package for the next stage
        run: node scripts/release/package-checkpoint.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-notarized-package
          path: .build/macos-package.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
  notarize-dmg:
    needs: package-dmg
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/macos-release-stage
        with:
          artifact: macos-notarized-package
      - name: Submit signed DMG and require notarization acceptance
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node scripts/release/notarize.mjs dmg
  staple-dmg:
    needs: notarize-dmg
    runs-on: macos-15
    timeout-minutes: 15
    env:
      MAKESHIFT_SIGN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/macos-release-stage
        with:
          artifact: macos-notarized-package
          ticket-network: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-sources
          path: .build/assets
      - name: Staple and validate accepted DMG
        run: node scripts/release/staple.mjs dmg
      - name: Verify signed package and prepare final assets
        run: |
          node scripts/release/verify.mjs
          node tests/release-package.mjs
          MAKESHIFT_TEST_EXECUTABLE="$PWD/.build/packages/Makeshift-darwin-arm64/Makeshift.app/Contents/MacOS/Makeshift" node tests/agent-finder-launch.mjs
          node scripts/release/assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-release
          path: .build/assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
  publish:
    needs: [build, staple-dmg]
    uses: ./.github/workflows/release-macos-publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      timestamp: ${{ needs.build.outputs.timestamp }}
    permissions:
      contents: write
      pages: write
      id-token: write
