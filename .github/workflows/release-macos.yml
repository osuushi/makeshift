name: Release macOS arm64
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-macos-arm64
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify signing configuration
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD IDENTITY APPLE_ID TEAM_ID NOTARY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name"; exit 1; }
          done
      - name: Select toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          brew install ccache ffmpeg
          test "$(uname -m)" = arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Release identity and cache keys
        id: version
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          tag=$(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$timestamp" +%Y%m%dT%H%M%SZ)
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "MAKESHIFT_RELEASE_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          echo "sdk=$(node scripts/release/cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/release-inputs/eigen.tar.gz
            .cache/release-inputs/boost.tar.bz2
            .cache/mesh-inputs/manifold.tar.gz
            .cache/mesh-inputs/tbb.tar.gz
            .cache/kernel/occt.tar.gz
            .cache/solver/source
          key: native-sources-${{ hashFiles('scripts/mesh-inputs.mjs', 'scripts/native-inputs.mjs', 'scripts/setup-native.mjs', 'scripts/setup-kernel.mjs', 'scripts/occt-recipe.json', 'native/solver/sources.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/kernel/sdk
          key: occt-macos-arm64-${{ steps.version.outputs.sdk }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ccache
          key: cxx-macos-arm64-${{ steps.version.outputs.sdk }}-${{ github.sha }}
          restore-keys: cxx-macos-arm64-${{ steps.version.outputs.sdk }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-macos-arm64-
      - name: Fetch mirrored Eigen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/release-inputs
          if [ ! -f .cache/release-inputs/eigen.tar.gz ]; then
            gh release download native-sources-eigen-5.0.1 --pattern eigen.tar.gz --dir .cache/release-inputs
          fi
      - name: Install dependencies and build native components
        run: |
          npm ci
          npm run setup:native
          npm run setup:kernel
          npm run setup:mesh
          npm run build:native
      - name: Save native sources before packaging
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/release-inputs/eigen.tar.gz
            .cache/release-inputs/boost.tar.bz2
            .cache/mesh-inputs/manifold.tar.gz
            .cache/mesh-inputs/tbb.tar.gz
            .cache/kernel/occt.tar.gz
            .cache/solver/source
          key: native-sources-${{ hashFiles('scripts/mesh-inputs.mjs', 'scripts/native-inputs.mjs', 'scripts/setup-native.mjs', 'scripts/setup-kernel.mjs', 'scripts/occt-recipe.json', 'native/solver/sources.json') }}
      - name: Save OCCT SDK before packaging
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/kernel/sdk
          key: occt-macos-arm64-${{ steps.version.outputs.sdk }}
      - name: Save compiler cache before packaging
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ccache
          key: cxx-macos-arm64-${{ steps.version.outputs.sdk }}-${{ github.sha }}
      - name: Save Electron download before packaging
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-arm64-${{ hashFiles('package-lock.json') }}
      - name: Check and package
        run: |
          npm run typecheck
          npm run check
          npm test
          npm run test:release
          npm run package:mac
          node tests/app-updates.mjs
          node scripts/release/verify.mjs
          node tests/release-package.mjs
          MAKESHIFT_TEST_EXECUTABLE="$PWD/.build/packages/Makeshift-darwin-arm64/Makeshift.app/Contents/MacOS/Makeshift" node tests/agent-finder-launch.mjs
          ccache --show-stats
      - name: Generate release feature demos
        run: |
          npx playwright install chromium
          npm run demos:check
      - name: Import certificate, sign and notarize
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAKESHIFT_SIGN: '1'
        run: bash scripts/release/sign-macos.sh
      - name: Verify signed artifact and matching sources
        env:
          MAKESHIFT_SIGN: '1'
        run: |
          node scripts/release/verify.mjs
          node tests/release-package.mjs
          MAKESHIFT_TEST_EXECUTABLE="$PWD/.build/packages/Makeshift-darwin-arm64/Makeshift.app/Contents/MacOS/Makeshift" node tests/agent-finder-launch.mjs
          node scripts/release/sources.mjs
          npm run demos:package -- .build/assets
          node scripts/release/assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: .build/assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  runtime-sources:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Preserve or reuse complete runtime sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/runtime-sources.mjs
  publish:
    needs: [build, runtime-sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release
          path: release-assets
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Prepare static preview feed
        run: node scripts/release/update-feed.mjs release-assets
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TIMESTAMP: ${{ needs.build.outputs.timestamp }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Makeshift $RELEASE_TIMESTAMP" --notes-file release-assets/RELEASE-NOTES.md
      # Never advertise an update until all of its release assets are published.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .build/update-site
  update-feed:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview update feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
